name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Check dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Repos without .github/dependency-review-config.yml: unchanged behaviour.
      - name: Review dependency changes
        if: hashFiles('.github/dependency-review-config.yml') == ''
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

      # Repos with .github/dependency-review-config.yml: the file is read, but every input
      # below is passed explicitly and the action lets explicit inputs override the file
      # (src/config.ts: { ...fileConfig, ...inlineInputs }). So a repo file can only ADD
      # settings we don't pin here, in practice allow-ghsas for known advisories. It cannot
      # lower the severity, narrow the scopes, switch to warn-only, turn the vulnerability
      # check off, or move the compared refs.
      - name: Review dependency changes (with repo config)
        if: hashFiles('.github/dependency-review-config.yml') != ''
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
          vulnerability-check: true
          warn-only: false
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
